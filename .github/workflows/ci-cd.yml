name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v7, verified with git ls-remote on 2026-07-06.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6, verified with git ls-remote on 2026-07-06.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build web app
        run: npm run build

  desktop-artifact:
    name: Build Windows desktop artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        # actions/checkout@v7, verified with git ls-remote on 2026-07-06.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v6, verified with git ls-remote on 2026-07-06.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust stable
        # dtolnay/rust-toolchain@stable branch, verified with git ls-remote on 2026-07-06.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri MSI
        # tauri-apps/tauri-action@v1, verified with git ls-remote on 2026-07-06.
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: novel-generator-[platform]-[arch]-[bundle]
